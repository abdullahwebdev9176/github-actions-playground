name: Continuous Integration (CI) Pipeline

# Trigger the workflow on push or pull request to main/master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs if a new commit is pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality (Linting & Type Checking)
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run ESLint check
        run: npm run lint

      - name: 🛡️ Run TypeScript type check
        run: npx tsc --noEmit

  # Job 2: Automated Tests
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck # Runs after lint-and-typecheck succeeds

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Execute unit tests
        run: npm test

  # Job 3: Production Build Check
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: test # Runs after tests pass

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Next.js project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
